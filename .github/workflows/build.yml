name: Build Shadow Client APK

on:
  push:
    branches: [ main, arena/cf219043-shadowclientff ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          ls "$ANDROID_HOME/platforms"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: List outputs
        run: find app/build/outputs -type f | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-client-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/*.apk \
            --title "Shadow Client — latest build" \
            --notes "Auto-built from ${GITHUB_SHA} · Android 9+ (arm64-v8a, armeabi-v7a, x86_64)"
